name: Feature

on:
  push:
    branches:
      - '**'
      - '!master'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Caches `~/.npm`, which is what `npm ci` reads. The previous setup
          # cached `**/node_modules` instead — `npm ci` deletes that directory
          # before installing, so the cache did nothing except risk restoring
          # platform binaries built for another runner image.
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Build extension
        run: npm run build

      # `--with-deps` installs the system libraries Chromium needs. Without them
      # the browser fails to launch on a bare runner, and every spec fails at
      # fixture setup with no useful message.
      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      # Headless: the fixture passes `--headless=new`, which supports
      # extensions, so no X server is needed.
      - name: Run e2e tests
        run: npx playwright test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/html
          if-no-files-found: ignore

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: test-results/artifacts
          if-no-files-found: ignore
