name: Master

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Caches `~/.npm`, which is what `npm ci` reads. The previous setup
          # cached `**/node_modules` instead — `npm ci` deletes that directory
          # before installing, so the cache did nothing except risk restoring
          # platform binaries built for another runner image.
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `npm run lint`, not `npx eslint .`: the script is `tsc --noEmit`
      # followed by eslint, and the type-check half is the one that has caught
      # real bugs. Calling eslint directly silently skipped it.
      - name: Lint and type-check
        run: npm run lint

      - name: Unit tests
        run: npm run test

      # The e2e specs are transpiled, never type-checked, by Playwright itself —
      # this is the only place the suite's types are verified at all.
      - name: Type-check e2e suite
        run: npm run e2e:types

      # `ci:build` is the production build — minified, prod Angular config,
      # exactly what `bundle:zip` packs into the shipped zip. Building `dev`
      # here meant the variant users install was never the variant under test.
      - name: Build extension
        run: npm run ci:build

      # `--with-deps` installs the system libraries Chromium needs. Without them
      # the browser fails to launch on a bare runner, and every spec fails at
      # fixture setup with no useful message.
      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      # Headless: the fixture passes `--headless=new`, which supports
      # extensions, so no X server is needed.
      - name: Run e2e tests
        run: npx playwright test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/html
          if-no-files-found: ignore

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: test-results/artifacts
          if-no-files-found: ignore
