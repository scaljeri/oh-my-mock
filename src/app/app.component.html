<!--
  Three-pane shell, following `design/Mock Manager v2.dc.html`:

    ┌─ header ────────────────────────────────────────────────┐
    │ brand │ domain + counts        │ preset │ mocking toggle │
    ├─ sidebar ─┬─ main ──────────────────────┬─ detail ───────┤
    │ domains   │ tabs, filters, request list │ mock detail    │
    └───────────┴─────────────────────────────┴────────────────┘

  The middle column holds the router outlet, so the existing pages keep
  working while they are restyled one at a time. The detail pane is a named
  outlet: a request row routes into it instead of navigating away from the
  list, which is the whole point of the new layout.
-->
<div class="oh-shell" [ngClass]="{ 'is-blurred': showDisabled || isInitializing }">
  <header class="oh-header">
    <div class="oh-header__brand">
      <button
        class="oh-header__menu"
        x-test="hamburger-menu-btn"
        type="button"
        aria-label="Menu"
        (click)="sidebarOpen = !sidebarOpen"
      >
        <mat-icon svgIcon="menu"></mat-icon>
      </button>
      <span class="oh-header__name">OhMyMock</span>
      <span class="oh-header__version">v{{ version }}</span>
    </div>

    <div class="oh-header__context">
      <h1 class="oh-header__domain oh-mono">{{ domain }}</h1>
      <a
        routerLink="cloud-sync"
        [routerLinkActive]="'is-syncing'"
        class="oh-header__sync"
        aria-label="Cloud sync"
      >
        <oh-my-cloud-sync-svg></oh-my-cloud-sync-svg>
      </a>
      <button
        *ngIf="errors.length"
        class="oh-header__errors"
        type="button"
        aria-label="Show errors"
        (click)="onErrors()"
      >
        <mat-icon svgIcon="error"></mat-icon>
      </button>
    </div>

    <div class="oh-header__actions">
      <oh-my-on-off-switch
        (change)="onEnableChange($event)"
        [checked]="enabled"
        x-test="header-active-toggle"
      ></oh-my-on-off-switch>
      <a
        class="oh-header__coffee"
        target="_blank"
        href="https://www.buymeacoffee.com/ohmymock"
      >
        <img alt="Buy me a coffee" src="assets/images/bmac-btn.png" />
      </a>
    </div>
  </header>

  <div class="oh-body">
    <aside class="oh-sidebar" [class.is-collapsed]="!sidebarOpen">
      <app-nav-list [context]="context" (navigate)="onNavigate()"></app-nav-list>
    </aside>

    <main class="oh-main">
      <div
        x-test="notice-disabled"
        *ngIf="!enabled && showDisabled !== 1 && domain"
        class="oh-notice"
      >
        OhMyMock is inactive
      </div>

      <section class="oh-main__content" *ngIf="!isInitializing">
        <router-outlet></router-outlet>
      </section>
    </main>
  </div>
</div>

<oh-my-feedback></oh-my-feedback>
<oh-my-spinner
  *ngIf="!context || connectionFailed === null"
  mode="dark"
></oh-my-spinner>

<oh-my-disabled-enabled
  *ngIf="showDisabled === 1 && !connectionFailed"
  (change)="onEnableChange($event)"
></oh-my-disabled-enabled>

<oh-my-connection-failure *ngIf="connectionFailed"></oh-my-connection-failure>
