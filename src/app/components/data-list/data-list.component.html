<!-- The colour legend that used to sit here explained a row-shading scheme the
     new list replaced with explicit Method, Response and Status columns. The
     preset selector and the overflow menu moved into the toolbar below. -->
<ng-container *ngIf="state$ | async as state">
<!-- Filter toolbar: its own row above the table, as in the design. It used to
     live inside the header row's Url cell. -->
<div class="oh-toolbar" [ngClass]="{ hidden: !state || hideFilter === true || requestCount === 0 }">
  <oh-my-preset
    *ngIf="showPreset && context"
    [context]="context"
    theme="light"
    class="oh-toolbar__preset"
  ></oh-my-preset>

  <oh-my-request-filter
    [data]="data"
    [filterOptions]="filterOptions"
    [filterStr]="filterKeywords"
    [lastResult]="filteredRequests"
    (update)="onFilterUpdate($event)"
    (updateFilterOptions)="onFilterUpdateOptions($event)"
    (updateFilterStr)="onFilterUpdateStr($event)"
  ></oh-my-request-filter>

  <label class="oh-toolbar__toggle" *ngIf="showActivateToggle">
    <mat-slide-toggle
      (change)="onToggleActivateNew($event.checked)"
      [checked]="$any(newAutoActivate)"
      color="primary"
    ></mat-slide-toggle>
    Activate new
  </label>

  <button
    *ngIf="showMenu"
    mat-icon-button
    aria-label="menu"
    [matMenuTriggerFor]="menu"
  >
    <mat-icon svgIcon="more_vert"></mat-icon>
  </button>

  <mat-menu #menu="matMenu">
    <ul class="main-menu">
      <li><button mat-menu-item (click)="onActivateAll(true)">Activate all requests</button></li>
      <li><button mat-menu-item (click)="onActivateAll(false)">Deactivate all requests</button></li>
      <li [ngClass]="{ 'is-selected': blurImages }">
        <button (click)="onBlurImage()" mat-menu-item><span>Blur images</span></button>
      </li>
    </ul>
  </mat-menu>
</div>

<ol data-table>
  <li class="oh-header">
    <span class="oh-col">Method</span>
    <span class="oh-col">Endpoint</span>
    <span class="oh-col">Response</span>
    <span class="oh-col">Status</span>
    <span class="oh-col oh-col--end">On</span>
  </li>

  <li
    [title]="row.id"
    class="oh-row"
    x-test="list-request-item"
    *ngFor="
      let row of filteredRequests | dataToViewList: data;
      index as index;
      trackBy: trackBy
    "
    (click)="onDataClick(row, index)"
    [ngClass]="{
      'is-clickable': togglableRows,
      'is-selected': selection.isSelected(index),
      'is-enabled': row.enabled[context.preset],
      'is-modified': row.mocks[row.selected[context.preset]]?.modifiedOn
    }"
  >
    <span class="oh-row__method" [attr.data-method]="row.method">{{ row.method }}</span>

    <span class="oh-row__endpoint">
      <span
        class="oh-row__url"
        [attr.data-content-start]="row.urlStart"
        [attr.data-content-end]="row.urlEnd"
      ></span>
      <span class="oh-row__meta">
        {{ row.requestType | lowercase }}
        <ng-container *ngIf="row.lastHit"> · last hit {{ row.lastHit | date: 'shortTime' }}</ng-container>
        <ng-container *ngIf="row.mocks[row.selected[context.preset]]?.label as label"> · {{ label }}</ng-container>
      </span>
    </span>

    <span class="oh-row__response" *ngIf="row.mocks[row.selected[context.preset]] as mock; else noResponse">
      <span class="oh-row__code" [attr.data-tone]="mock.statusCode | ohStatusCodeTone">
        {{ mock.statusCode || '—' }}
      </span>
      <span class="oh-row__delay">{{ mock.modifiedOn ? 'modified' : 'recorded' }}</span>
    </span>
    <ng-template #noResponse>
      <span class="oh-row__response">
        <span class="oh-row__code" data-tone="muted">—</span>
        <span class="oh-row__delay">no response</span>
      </span>
    </ng-template>

    <span class="oh-row__state">
      <span class="oh-pill" [attr.data-state]="rowState(row)">{{ rowState(row) }}</span>
    </span>

    <ng-container
      *ngTemplateOutlet="actions; context: { row: row, index: index }"
    ></ng-container>
  </li>
</ol>
</ng-container>

<ng-template #actions let-row="row" let-index="index">
  <div class="actions btns-1">
    <div class="btn-wrapper">
      <button
        *ngIf="showActivate"
        (click)="onActivateToggle(row.id, $event)"
        mat-icon-button
        color="primary"
        aria-label="Example icon button with a menu icon"
      >
        <mat-icon
          svgIcon="play_arrow"
          color="primary"
          *ngIf="!row.enabled[context?.preset]"
        ></mat-icon>
        <mat-icon
          svgIcon="stop"
          color="primary"
          *ngIf="row.enabled[context?.preset]"
        ></mat-icon>
      </button>
      <button
        *ngIf="showClone"
        (click)="onClone(row.id, $event)"
        mat-icon-button
        color="primary"
        aria-label="Example icon button with a menu icon"
      >
        <mat-icon svgIcon="content_copy" color="primary"></mat-icon>
      </button>
      <button
        *ngIf="showDelete"
        (click)="onDelete(row.id, $event)"
        mat-icon-button
        color="primary"
        aria-label="Example icon button with a menu icon"
      >
        <mat-icon svgIcon="delete" color="primary"></mat-icon>
      </button>
      <button
        *ngIf="showExport"
        (click)="onExport(row, index, $event)"
        mat-icon-button
        color="primary"
        aria-label="Example icon button with a menu icon"
      >
        <mat-icon svgIcon="import_export" color="primary"></mat-icon>
      </button>
    </div>
  </div>
</ng-template>
