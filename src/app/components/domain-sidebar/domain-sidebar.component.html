<!--
The drawer: where to go at the top, then the **mocks** answering for the domain
being looked at — each row a named set, on or off for this site.

There is no domain picker: the url in the active tab decides which domain this
is. Adding and forgetting domains is housekeeping and lives on its own page.

"Group" is the word in the code, not on screen. It is a technical name for a set
of mocks with a source, and putting it in front of someone reading the drawer
would ask them to learn a concept where they only wanted to see their mocks.
-->
<div class="oh-domain-nav">
  <oh-my-nav-list
    class="oh-domain-nav__nav"
    [context]="context"
    (navigate)="navigate.emit()"
  ></oh-my-nav-list>

  <h2 class="oh-domain-nav__heading">Mocks</h2>

  <!--
  The list is draggable because its order is not decoration: it is
  `IOhMyMock.groups`, and when two sets both know an endpoint the higher one
  answers. Dragging is global — the same order on every domain — where the
  checkbox beside it is per domain.
  -->
  <ul
    class="oh-group-nav__list"
    cdkDropList
    (cdkDropListDropped)="onDrop($event)"
  >
    @for (row of groups; track trackByGroup($index, row)) {
      <li class="oh-group-nav__row" cdkDrag cdkDragLockAxis="y">
        <!--
        A handle, so the drag cannot start on the checkbox beside it. Without
        one, every attempt to switch a group off that moved a few pixels became
        a reorder instead — the two gestures would share one target.

        A `button` rather than a decorated `span`: the CDK's drag is
        pointer-only, so the arrow keys are the whole of the keyboard story and
        they need something focusable to arrive at.
        -->
        <button
          class="oh-group-nav__grip"
          type="button"
          cdkDragHandle
          x-test="group-grip"
          [attr.aria-label]="'Reorder ' + row.group.name"
          title="Drag, or use the arrow keys — the higher a set is, the sooner it answers"
          (keydown)="onReorderKey($event, $index)"
        ></button>
        <!--
        A checkbox rather than a link: it does not navigate, it decides whether
        this group answers here. Switched off is stored per domain, so the same
        group stays on for the other domains it covers.
        -->
        <button
          class="oh-group-nav__item"
          type="button"
          role="checkbox"
          x-test="group-item"
          [attr.aria-checked]="row.enabled"
          [class.is-off]="!row.enabled"
          [title]="
            row.enabled
              ? 'Switch off for ' + activeDomain
              : 'Switch on for ' + activeDomain
          "
          (click)="onToggleGroup(row)"
        >
<!-- The tick is drawn in CSS. There is no `check` asset and an unregistered
          `svgIcon` renders nothing at all — silently, which is how this project
          keeps losing icons. -->
          <span
            class="oh-group-nav__check"
            [class.is-on]="row.enabled"
            aria-hidden="true"
          ></span>
          <span class="oh-group-nav__name" x-test="group-name">{{
            row.group.name
          }}</span>
          <!-- Only the sources that are somewhere else are labelled; this
          browser's own is the ordinary case and a badge on every row would be
          noise. -->
          @if (row.group.source !== 'local') {
            <span class="oh-group-nav__source" x-test="group-source">{{
              row.group.source
            }}</span>
          }
          <span class="oh-group-nav__count" x-test="group-count">{{
            row.requests
          }}</span>
        </button>
      </li>
    }
  </ul>

  @if (!groups.length) {
    <p class="oh-domain-nav__empty" x-test="no-groups">No mocks yet</p>
  }

  <div class="oh-domain-nav__footer">
    <button
      class="oh-domain-nav__import"
      type="button"
      x-test="import-har"
      title="Import a session exported from the DevTools Network panel"
      (click)="onImportHar()"
    >
      Import HAR file
    </button>
  </div>
</div>
