<!--
The sidebar picks a domain and lists that domain's **mocks** — each row a named
set, on or off for this site.

"Group" is the word in the code, not on screen. It is a technical name for a set
of mocks with a source, and putting it in front of someone reading the sidebar
would ask them to learn a concept where they only wanted to see their mocks.

The two actions at the bottom are unchanged; the old nav links (reset, explore,
import/export, docs) live in the overflow menu — see `oh-my-nav-list`.
-->
<div class="oh-domain-nav">
  <!-- A picker rather than a list: the sidebar is about the domain being looked
  at, and the domain itself is already named in the header. -->
  <label class="oh-domain-nav__picker">
    <span class="oh-domain-nav__picker-label">Domain</span>
    <select
      class="oh-domain-nav__select"
      x-test="domain-select"
      aria-label="Domain"
      [ngModel]="activeDomain"
      (ngModelChange)="onSelect($event)"
    >
      @for (summary of domains; track trackByDomain($index, summary)) {
        <option x-test="domain-option" [value]="summary.domain">
          {{ summary.domain }}
        </option>
      }
    </select>
  </label>

  @if (!domains.length) {
    <p class="oh-domain-nav__empty">No domains yet</p>
  }

  <h2 class="oh-domain-nav__heading">Mocks</h2>

  <ul class="oh-group-nav__list">
    @for (row of groups; track trackByGroup($index, row)) {
      <li>
        <!--
        A checkbox rather than a link: it does not navigate, it decides whether
        this group answers here. Switched off is stored per domain, so the same
        group stays on for the other domains it covers.
        -->
        <button
          class="oh-group-nav__item"
          type="button"
          role="checkbox"
          x-test="group-item"
          [attr.aria-checked]="row.enabled"
          [class.is-off]="!row.enabled"
          [title]="
            row.enabled
              ? 'Switch off for ' + activeDomain
              : 'Switch on for ' + activeDomain
          "
          (click)="onToggleGroup(row)"
        >
<!-- The tick is drawn in CSS. There is no `check` asset and an unregistered
          `svgIcon` renders nothing at all — silently, which is how this project
          keeps losing icons. -->
          <span
            class="oh-group-nav__check"
            [class.is-on]="row.enabled"
            aria-hidden="true"
          ></span>
          <span class="oh-group-nav__name" x-test="group-name">{{
            row.group.name
          }}</span>
          <!-- Only the sources that are somewhere else are labelled; this
          browser's own is the ordinary case and a badge on every row would be
          noise. -->
          @if (row.group.source !== 'local') {
            <span class="oh-group-nav__source" x-test="group-source">{{
              row.group.source
            }}</span>
          }
          <span class="oh-group-nav__count" x-test="group-count">{{
            row.requests
          }}</span>
        </button>
      </li>
    }
  </ul>

  @if (!groups.length) {
    <p class="oh-domain-nav__empty" x-test="no-groups">No mocks yet</p>
  }

  <div class="oh-domain-nav__footer">
    @if (isAdding) {
      <form class="oh-domain-nav__new" (ngSubmit)="onAddDomain()">
        <input
          #newDomainInput
          class="oh-domain-nav__new-input"
          name="newDomain"
          placeholder="example.com"
          aria-label="Domain to add"
          x-test="new-domain"
          [ngModel]="newDomain"
          (ngModelChange)="newDomain = $event"
          (keyup.escape)="onCancelAdd()"
        />
        <button class="oh-domain-nav__new-confirm" type="submit">Add</button>
        <button
          class="oh-domain-nav__new-cancel"
          type="button"
          (click)="onCancelAdd()"
        >
          Cancel
        </button>
      </form>
    }

    @if (!isAdding) {
      <button
        class="oh-domain-nav__add"
        type="button"
        x-test="add-domain"
        (click)="onStartAdd()"
      >
        <span class="oh-domain-nav__add-sign">+</span> Add domain
      </button>
    }

    <div class="oh-domain-nav__actions">
      <button
        class="oh-domain-nav__import"
        type="button"
        x-test="import-har"
        title="Import a session exported from the DevTools Network panel"
        (click)="onImportHar()"
      >
        Import HAR file
      </button>

      <oh-my-nav-list
        class="oh-domain-nav__more"
        [context]="context"
        (navigate)="navigate.emit()"
      ></oh-my-nav-list>
    </div>
  </div>
</div>
