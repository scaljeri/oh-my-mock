<mat-form-field>
  <mat-label>{{ label }}</mat-label>
  <input
    [ngClass]="{ 'has-errors': ngControl.hasError('noExactOptionMatch') }"
    #input
    (blur)="onBlur()"
    (focus)="onFocus()"
    type="text"
    matInput
    [formControl]="ctrl"
    #trigger="matAutocompleteTrigger"
    [matAutocomplete]="auto"
  />
  <mat-autocomplete
    autoActiveFirstOption
    #auto="matAutocomplete"
    (opened)="onAutoCompleteOpened()"
    (closed)="onAutoCompleteClose()"
    (optionSelected)="onOptionSelected()"
  >
    @for (option of filteredMethodOptions || []; track option) {
      <mat-option [value]="option" [title]="optionLabels[option] || option">
        {{ optionLabels[option] || option }}
      </mat-option>
    }
  </mat-autocomplete>

  @if (ctrl.value) {
    <button
      matSuffix
      mat-icon-button
      aria-label="Clear"
      (click)="onClear($event); input.focus(); trigger.openPanel()"
    >
      <mat-icon [ngClass]="theme" svgIcon="close" matTooltip="Clear"></mat-icon>
    </button>
  }
  @if (showCopy) {
    <button
      matSuffix
      mat-icon-button
      aria-label="Clear"
      (click)="onClickEdit($event)"
    >
      <mat-icon
        [ngClass]="theme"
        [matTooltip]="copyInfo"
        svgIcon="content_copy"
      ></mat-icon>
    </button>
  }
  @if (showDelete) {
    <button
      matSuffix
      mat-icon-button
      x-test="dropdown-delete"
      aria-label="Delete"
      (click)="onClickDelete()"
    >
      <mat-icon
        [ngClass]="theme"
        svgIcon="delete"
        matTooltip="Delete"
      ></mat-icon>
    </button>
  }
</mat-form-field>
