@if (!base) {
  <ngx-monaco-editor
    class="oh-no-backspace-nav"
    [options]="editorOptions"
    [formControl]="editorCtrl"
    (onInit)="onInitEditor($event)"
  ></ngx-monaco-editor>
}

@if (base) {
  <ngx-monaco-diff-editor
    class="oh-no-backspace-nav"
    [options]="editorOptions"
    [originalModel]="originalModel"
    [modifiedModel]="modifiedModel"
    (onInit)="onInitDiffEditor($event)"
  >
  </ngx-monaco-diff-editor>
}
