<!--
  The app-wide actions that used to be a list of buttons filling the sidebar.
  The sidebar is the domain list now, so they moved into an overflow menu at
  the bottom of it — nothing was dropped.
-->
<button
  class="oh-nav-menu__trigger"
  type="button"
  aria-label="More actions"
  title="More actions"
  x-test="nav-menu-btn"
  [matMenuTriggerFor]="menu"
>
  <mat-icon svgIcon="more_vert"></mat-icon>
</button>

<mat-menu #menu="matMenu">
  <button mat-menu-item type="button" (click)="onReset()">Reset state</button>
  <button mat-menu-item type="button" routerLink="/state-explore" (click)="navigate.emit()">
    Explore state
  </button>
  <button mat-menu-item type="button" routerLink="/json-export" (click)="navigate.emit()">
    JSON export
  </button>
  <button mat-menu-item type="button" (click)="onJsonImport()">JSON import</button>
  <button
    mat-menu-item
    type="button"
    x-test="nav-remote-mocking"
    routerLink="/remote-mocking"
    (click)="navigate.emit()"
  >
    Remote mocking
  </button>
  <a
    mat-menu-item
    target="_blank"
    rel="noopener"
    href="https://scaljeri.github.io/oh-my-mock/documentation/index.html"
    >Documentation</a
  >
  <a
    mat-menu-item
    target="_blank"
    rel="noopener"
    href="https://github.com/scaljeri/oh-my-mock/blob/feature/cypress/CHANGELOG.md"
    >Changelog</a
  >
  <a
    mat-menu-item
    target="_blank"
    rel="noopener"
    href="https://scaljeri.github.io/oh-my-mock/index.html"
    >Demo Site</a
  >
</mat-menu>
