<div class="filter-field" [ngClass]="{ active: filterCtrl.value }">
  <mat-form-field class="search" [floatLabel]="'auto'">
    <input
      type="search"
      matInput
      placeholder="Filter"
      [formControl]="filterCtrl"
    />
    @if (filterCtrl.value) {
      <button
        class="clear"
        matSuffix
        mat-icon-button
        aria-label="Clear"
        (click)="filterCtrl.setValue('')"
      >
        <mat-icon svgIcon="close" class="dark"></mat-icon>
      </button>
    }
  </mat-form-field>
  <mat-icon
    class="search-help"
    color="primary"
    matTooltip="Each word in this search field is searched for independently from each other. To combine multiple words use quotes"
    svgIcon="info"
  >
  </mat-icon>
  @if (filterOptions && filter) {
    <mat-icon
      [matMenuTriggerFor]="filter"
      class="search-config"
      color="primary"
      svgIcon="filter_list"
    ></mat-icon>
  }
  <mat-menu #filter="matMenu">
    <!-- The click guard is what keeps the menu open while options are ticked:
    `mat-menu`'s panel closes on *any* click inside it. `role="presentation"`
    says what this wrapper is — a propagation guard around the options, not
    a control of its own. -->
    <div
      class="filter-menu"
      role="presentation"
      (click)="$event.stopPropagation()"
    >
      <p class="filter-menu__title">Include:</p>
      @if (filterOptions) {
        <ul aria-label="Include">
          @for (option of filterOptionsData; track option) {
            <li>
              <mat-checkbox
                class="example-margin"
                [(ngModel)]="filterOptions[option.id]"
                (change)="onFilterOption()"
                >{{ option.label }}</mat-checkbox
              >
            </li>
          }
        </ul>
      }
    </div>
  </mat-menu>
</div>
