<!-- The four response settings, as a 2x2 grid of plain inputs. See
`design/Mock Manager v2.dc.html`. -->
@if (form) {
  <form class="oh-fields" [formGroup]="form">
    <label class="oh-field">
      <span class="oh-field__label">Status code</span>
      <input
        class="oh-field__input oh-field__input--mono"
        type="text"
        inputmode="numeric"
        list="oh-status-codes"
        x-test="mock-status-code"
        formControlName="statusCode"
      />
      <datalist id="oh-status-codes">
        @for (option of statusCodeOptions; track option) {
          <option [value]="option.value" [label]="option.label"></option>
        }
      </datalist>
    </label>
    <label class="oh-field">
      <span class="oh-field__label">Delay (ms)</span>
      <input
        class="oh-field__input oh-field__input--mono"
        type="text"
        inputmode="numeric"
        placeholder="0"
        x-test="mock-delay"
        formControlName="delay"
      />
    </label>
    <label class="oh-field">
      <span class="oh-field__label">Content type</span>
      <input
        class="oh-field__input"
        type="text"
        list="oh-mime-types"
        x-test="mock-content-type"
        formControlName="contentType"
      />
      <datalist id="oh-mime-types">
        @for (mimeType of mimeTypes; track mimeType) {
          <option [value]="mimeType"></option>
        }
      </datalist>
    </label>
    <!-- A button rather than a field: the cookies are a list, and a list does
    not fit a 2x2 grid of inputs. Its own cell so it lines up with them. -->
    <div class="oh-field">
      <span class="oh-field__label">Cookies</span>
      <button
        class="oh-field__button"
        type="button"
        x-test="mock-cookies"
        [title]="
          cookieCount
            ? cookieCount + ' cookie(s) set by this response'
            : 'This response sets no cookies'
        "
        (click)="onEditCookies()"
      >
        @if (cookieCount) {
          {{ cookieCount }} cookie{{ cookieCount === 1 ? '' : 's' }}
        } @else {
          None
        }
      </button>
    </div>
    <label class="oh-field">
      <span class="oh-field__label">Label</span>
      <input
        class="oh-field__input"
        type="text"
        placeholder="e.g. empty list"
        x-test="mock-label"
        formControlName="label"
      />
    </label>
  </form>
}
