<!-- Top of the detail pane, following `design/Mock Manager v2.dc.html`: the
method + url line with its metadata, then the saved-response chips. -->
<header class="oh-detail__head">
  <div class="oh-detail__title">
    <button
      class="oh-detail__request"
      type="button"
      x-test="request-edit-toggle"
      [attr.aria-expanded]="isEditing"
      title="Edit the method, type and url of this request"
      (click)="onToggleEdit()"
    >
      <span class="oh-detail__method" [attr.data-method]="request.method">{{
        request.method
      }}</span>
      <span class="oh-detail__url">{{ request.url }}</span>
    </button>

    <div class="oh-detail__head-actions">
      <button
        class="oh-icon-btn"
        type="button"
        [disabled]="isPassthrough"
        title="Duplicate the response on display"
        aria-label="Duplicate the response on display"
        (click)="onCloneResponse()"
      >
        <mat-icon svgIcon="content_copy"></mat-icon>
      </button>
      <button
        class="oh-icon-btn oh-icon-btn--danger"
        type="button"
        [disabled]="isPassthrough"
        title="Delete the response on display"
        aria-label="Delete the response on display"
        (click)="onDeleteResponse()"
      >
        <mat-icon svgIcon="close"></mat-icon>
      </button>
    </div>
  </div>

  <p class="oh-detail__meta">
    {{ request.requestType | lowercase }} · {{ responseCountLabel }}
    @if (request.lastHit) {
      · last hit {{ request.lastHit | date: 'shortTime' }}
    }
  </p>
</header>

<!-- Revealed by the header line. Same field styling as the response settings
grid below it, so the pane reads as one form. -->
@if (isEditing) {
  <section class="oh-detail__section oh-detail__edit">
    <div class="oh-fields">
      <label class="oh-field">
        <span class="oh-field__label">Type</span>
        <select class="oh-field__input" [formControl]="typeCtrl">
          @for (type of requestTypes; track type) {
            <option [value]="type">{{ type }}</option>
          }
        </select>
      </label>
      <label class="oh-field">
        <span class="oh-field__label">Method</span>
        <input
          class="oh-field__input oh-field__input--mono"
          type="text"
          list="oh-request-methods"
          [formControl]="methodCtrl"
        />
        <datalist id="oh-request-methods">
          @for (method of availableMethods; track method) {
            <option [value]="method"></option>
          }
        </datalist>
      </label>
      <label class="oh-field oh-field--wide">
        <span class="oh-field__label"
          >Url — matched as a regular expression</span
        >
        <input
          class="oh-field__input oh-field__input--mono"
          type="text"
          placeholder="Match API endpoint (regexp)"
          [formControl]="urlCtrl"
        />
      </label>
    </div>
  </section>
}

<section class="oh-detail__section">
  <h2 class="oh-detail__label">Saved responses</h2>

  <div class="oh-chips">
    <button
      class="oh-chip"
      type="button"
      [class.is-selected]="isPassthrough"
      (click)="onDisableRequest()"
    >
      <span class="oh-chip__code" data-tone="muted">Off</span>
      <span class="oh-chip__label">passthrough</span>
    </button>

    @for (chip of chips; track chip) {
      <button
        class="oh-chip"
        type="button"
        x-test="saved-response"
        [class.is-selected]="chip.isSelected"
        (click)="onSelectStatusCode(chip.id)"
      >
        <span
          class="oh-chip__code"
          [attr.data-tone]="chip.statusCode | ohStatusCodeTone"
        >
          {{ chip.statusCode }}
        </span>
        @if (chip.label) {
          <span class="oh-chip__label">{{ chip.label }}</span>
        }
      </button>
    }

    <button
      class="oh-chip oh-chip--add"
      type="button"
      x-test="add-saved-response"
      (click)="openAddResponseDialog()"
    >
      + Add
    </button>
  </div>
</section>
