<!-- The request list, and the detail of whichever request is selected. The
detail is a routed child (`request/:dataId`), so selecting a row updates the url
without taking the list off screen — and it slides in *over* the list rather
than beside it, so the list never loses width to it. -->
<div class="oh-panes" [class.has-detail]="hasDetail">
  <div class="oh-panes__list">
    @if (state) {
      <!-- `showClone` and `showDelete` are off deliberately. The row's action
      cell carries `.actions { button + button { display: none } }`, so only the
      first of the three buttons has ever been rendered — the clone and delete
      behind these flags were in the DOM and in the tab order while being
      invisible, which is how a keyboard user could reach an unlabelled button
      and delete a request with nothing on screen to say so. Both actions live in
      the detail panel's own menu now, where there is room to name them. -->
      <oh-my-data-list
        [state]="state"
        [requests]="requests"
        [context]="state.context"
        [showActivate]="true"
        [showClone]="false"
        [showDelete]="false"
        [showMenu]="true"
        (selectRow)="onDataSelect($event)"
      >
      </oh-my-data-list>
    }

    @if (!hasData) {
      <section class="no-data">
        <h2>No responses available</h2>
        <p>
          Any Fetch or XHR call will automatically show up here if this
          extension is active!
        </p>
        <oh-my-arrow></oh-my-arrow>
      </section>
    }

    @if (!domain) {
      <button
        (click)="onAddData()"
        class="new-data"
        mat-fab
        color="primary"
        aria-label="Delete all mocks for a specific URL"
      >
        <!-- <mat-icon>add</mat-icon> -->
        <mat-icon x-test="add-response" class="add" svgIcon="add"></mat-icon>
      </button>
    }
  </div>

  @if (hasDetail) {
    <aside
      class="oh-panes__detail"
      x-test="request-detail"
      aria-label="Request detail"
    >
      <button
        class="oh-panes__collapse"
        type="button"
        x-test="close-detail"
        title="Close this request"
        aria-label="Close this request"
        (click)="onCloseDetail()"
      >
        <mat-icon svgIcon="keyboard_arrow_left"></mat-icon>
      </button>
      <router-outlet></router-outlet>
    </aside>
  }
</div>
